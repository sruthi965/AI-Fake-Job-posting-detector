<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account · JobGuard AI</title>
  <meta name="description" content="AI-based fake job posting detector: check a job ad for scam warning signs.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="register">
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <div class="auth-wrap card">
      <h1>Create an account</h1>
      <p class="muted">An account lets you keep a history of your analyses.</p>
      <div id="form-error" class="alert error" role="alert" tabindex="-1"></div>
      <form id="register-form">
        <div class="field"><label for="full_name">Full name</label><input id="full_name" name="full_name" required minlength="2" maxlength="120" autocomplete="name"></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password"><span class="hint">At least 8 characters.</span></div>
        <button class="btn" type="submit">Create account</button>
      </form>
      <p class="alt">Already registered? <a href="login.html">Log in</a></p>
    </div>
  </main>
  <footer class="site-footer">JobGuard AI is an educational tool. Predictions are estimates, not proof of fraud or legitimacy.</footer>
  <script src="js/auth.js" defer></script>
</body>
</html>
